<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat App</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary-color: #4a69bd;
            --primary-hover: #3c5496;
            --user-msg-bg: #4a69bd;
            --user-msg-text: #ffffff;
            --model-msg-bg: #f1f2f6;
            --model-msg-text: #2f3542;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        /* ヘッダー＆タブバー */
        .header {
            background: #2f3542;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            background: #57606f;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #dcdde1;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #2f3542;
            border-bottom-color: var(--primary-color);
        }

        /* コンテンツエリア */
        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* チャット画面 */
        #chat-tab {
            padding: 0;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 2px;
        }

        .model-msg {
            align-self: flex-start;
            background-color: var(--model-msg-bg);
            color: var(--model-msg-text);
            border-bottom-left-radius: 2px;
        }

        .msg-header {
            font-size: 0.75rem;
            margin-bottom: 4px;
            opacity: 0.8;
            font-weight: bold;
        }

        .input-area {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-area input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .btn-send {
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background-color: var(--primary-hover);
        }

        /* 設定画面 */
        .section-title {
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
            margin-top: 15px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: #485460;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-save {
            padding: 12px 20px;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background-color: #26af5f;
        }

        .loading-dots {
            font-style: italic;
            color: #747d8c;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>Gemini AI Chat</h1>
        </div>

        <!-- タブナビゲーション -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chat-tab')">💬 チャット</button>
            <button class="tab-btn" onclick="switchTab('basic-settings-tab')">⚙️ 基本・接続設定</button>
            <button class="tab-btn" onclick="switchTab('char-settings-tab')">🎭 キャラ・詳細設定</button>
        </div>

        <!-- 1. チャットタブ -->
        <div id="chat-tab" class="tab-content active">
            <div class="chat-container" id="chatBox">
                <div class="message model-msg">
                    <div class="msg-header" id="welcomeCharName">エリザベス</div>
                    <div>ご主人様、準備が整いましたわ。何なりとお申し付けくださいませ。</div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">送信</button>
            </div>
        </div>

        <!-- 2. 基本設定タブ -->
        <div id="basic-settings-tab" class="tab-content">
            <div class="section-title">🔑 API ＆ モデル接続設定</div>
            <div class="form-group">
                <label>Gemini APIキー:</label>
                <input type="password" id="apiKeyInput" placeholder="AI Studioで取得したAPIキーを入力">
            </div>
            <div class="form-group">
                <label>使用モデル名:</label>
                <input type="text" id="modelNameInput" value="gemini-1.5-flash" placeholder="例: gemini-1.5-flash, gemini-2.0-flash">
            </div>
            <button class="btn-save" onclick="saveSettings()">基本設定を保存</button>
        </div>

        <!-- 3. キャラクター・詳細設定タブ -->
        <div id="char-settings-tab" class="tab-content">
            <div class="section-title">🎭 キャラクター基本設定</div>
            <div class="form-row">
                <div class="form-group">
                    <label>キャラクター名:</label>
                    <input type="text" id="charNameInput" value="エリザベス">
                </div>
                <div class="form-group">
                    <label>一人称:</label>
                    <input type="text" id="firstPersonInput" value="私">
                </div>
                <div class="form-group">
                    <label>二人称（ユーザーの呼び方）:</label>
                    <input type="text" id="secondPersonInput" value="ご主人様">
                </div>
            </div>

            <div class="form-group">
                <label>性格・全体設定:</label>
                <textarea id="charPersonalityInput" rows="2">丁寧で上品なメイド。〜ですわ、〜ございますなどの口調。</textarea>
            </div>

            <div class="section-title">👤 ユーザープロファイル・口調詳細</div>
            <div class="form-row">
                <div class="form-group">
                    <label>ユーザーの本名 (userName):</label>
                    <input type="text" id="userNameInput" placeholder="例: 太郎">
                </div>
                <div class="form-group">
                    <label>ユーザーの愛称 (userNickname):</label>
                    <input type="text" id="userNicknameInput" placeholder="例: 様">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>口調スタイル (speechStyle):</label>
                    <input type="text" id="speechStyleInput" value="丁寧・お嬢様/メイド風">
                </div>
                <div class="form-group">
                    <label>語尾・口調カスタム (speechCustom):</label>
                    <input type="text" id="speechCustomInput" placeholder="例: 語尾に「〜ですわ」を付ける">
                </div>
            </div>

            <div class="section-title">🛠️ 詳細設定 (JSON形式)</div>
            <div class="form-group">
                <label>詳細プロンプト設定 (detailSettings):</label>
                <textarea id="detailSettingsInput" rows="4" placeholder='{"mood": "happy", "relationship": "master_and_servant"}'>{}</textarea>
            </div>

            <button class="btn-save" onclick="saveSettings()">全キャラクター設定を保存</button>
        </div>
    </div>

    <script>
        // グローバル状態
        let chatHistory = [];

        // ページ読み込み時に設定を復元
        window.onload = function() {
            loadSavedSettings();
        };

        // タブ切り替え処理
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 設定の読み込み
        function loadSavedSettings() {
            const apiKey = localStorage.getItem('geminiApiKey') || '';
            const modelName = localStorage.getItem('geminiModelName') || 'gemini-1.5-flash';
            
            document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('modelNameInput').value = modelName;

            const savedChar = localStorage.getItem('geminiCharFullSettings');
            if (savedChar) {
                try {
                    const data = JSON.parse(savedChar);
                    document.getElementById('charNameInput').value = data.name || 'エリザベス';
                    document.getElementById('firstPersonInput').value = data.firstPerson || '私';
                    document.getElementById('secondPersonInput').value = data.secondPerson || 'ご主人様';
                    document.getElementById('charPersonalityInput').value = data.personality || '';
                    document.getElementById('userNameInput').value = data.userName || '';
                    document.getElementById('userNicknameInput').value = data.userNickname || '';
                    document.getElementById('speechStyleInput').value = data.speechStyle || '丁寧';
                    document.getElementById('speechCustomInput').value = data.speechCustom || '';
                    document.getElementById('detailSettingsInput').value = JSON.stringify(data.detailSettings || {}, null, 2);
                    
                    document.getElementById('welcomeCharName').innerText = data.name || 'エリザベス';
                } catch(e) {
                    console.error("設定読み込みエラー", e);
                }
            }
        }

        // 設定の保存処理
        function saveSettings() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const modelName = document.getElementById('modelNameInput').value.trim() || 'gemini-1.5-flash';

            localStorage.setItem('geminiApiKey', apiKey);
            localStorage.setItem('geminiModelName', modelName);

            let detailJson = {};
            try {
                const jsonText = document.getElementById('detailSettingsInput').value.trim();
                if (jsonText) {
                    detailJson = JSON.parse(jsonText);
                }
            } catch (e) {
                alert('⚠️ 詳細設定(JSON形式)の書き方に誤りがございます。正しいJSON形式で入力してください。');
                return;
            }

            const charData = {
                name: document.getElementById('charNameInput').value.trim(),
                firstPerson: document.getElementById('firstPersonInput').value.trim(),
                secondPerson: document.getElementById('secondPersonInput').value.trim(),
                personality: document.getElementById('charPersonalityInput').value.trim(),
                userName: document.getElementById('userNameInput').value.trim(),
                userNickname: document.getElementById('userNicknameInput').value.trim(),
                speechStyle: document.getElementById('speechStyleInput').value.trim(),
                speechCustom: document.getElementById('speechCustomInput').value.trim(),
                detailSettings: detailJson
            };

            localStorage.setItem('geminiCharFullSettings', JSON.stringify(charData));
            document.getElementById('welcomeCharName').innerText = charData.name || 'エリザベス';

            alert('✨ 設定を正常に保存いたしましたわ！');
        }

        // メッセージ送信処理
        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            // ユーザーメッセージ描画
            appendMessage('user', 'あなた', text);
            inputEl.value = '';

            // 一時的な「応答作成中...」メッセージを表示
            const charName = document.getElementById('charNameInput').value.trim() || 'AI';
            const loadingId = appendLoadingMessage(charName);

            try {
                // API呼び出し
                const reply = await callGeminiAPI(text);
                removeMessage(loadingId);
                
                // AIからの返答描画
                appendMessage('model', charName, reply);

                // 履歴管理
                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'model', content: reply });
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('model', 'システム', `⚠️ 処理中にエラーが発生いたしました:\n${err.message}`);
            }
        }

        // チャット画面へのメッセージ追加
        function appendMessage(sender, name, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'model-msg'}`;
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'msg-header';
            headerDiv.innerText = name;

            const textDiv = document.createElement('div');
            textDiv.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');

            msgDiv.appendChild(headerDiv);
            msgDiv.appendChild(textDiv);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ローディング用表示
        function appendLoadingMessage(name) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            const id = 'loading-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = 'message model-msg loading-dots';
            msgDiv.innerText = `${name}が応答を作成中...`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Gemini API通信コア処理
        async function callGeminiAPI(userMessage) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) {
                return 'Gemini APIキーが設定されていません。「基本・接続設定」タブからキーを入力・保存してくださいませ。';
            }

            const modelName = localStorage.getItem('geminiModelName') || 'gemini-1.5-flash';

            // 各種キャラクター設定の組み立て
            const charName = document.getElementById('charNameInput').value.trim() || 'AI';
            const firstPerson = document.getElementById('firstPersonInput').value.trim();
            const secondPerson = document.getElementById('secondPersonInput').value.trim();
            const personality = document.getElementById('charPersonalityInput').value.trim();
            const userName = document.getElementById('userNameInput').value.trim();
            const userNickname = document.getElementById('userNicknameInput').value.trim();
            const speechStyle = document.getElementById('speechStyleInput').value.trim();
            const speechCustom = document.getElementById('speechCustomInput').value.trim();

            let detailSettings = {};
            try {
                const jsonText = document.getElementById('detailSettingsInput').value.trim();
                if (jsonText) detailSettings = JSON.parse(jsonText);
            } catch(e) {}

            const userCall = userName ? `${userName}${userNickname}` : secondPerson;

            const systemPrompt = `あなたは${charName}というキャラクターです。
性格・設定: ${personality}
一人称: ${firstPerson}
ユーザーの呼び方: ${userCall}
口調スタイル: ${speechStyle}
${speechCustom ? `語尾・特徴: ${speechCustom}` : ''}
詳細設定: ${JSON.stringify(detailSettings)}
この設定を厳格に守り、魅力的なキャラクターとして会話してください。`;

            const contents = [
                { role: 'user', parts: [{ text: `[システム設定]\n${systemPrompt}` }] },
                { role: 'model', parts: [{ text: `了解いたしました。私は${charName}として振る舞います。` }] }
            ];

            chatHistory.slice(-6).forEach(msg => {
                contents.push({
                    role: msg.role === 'user' ? 'user' : 'model',
                    parts: [{ text: msg.content }]
                });
            });

            contents.push({ role: 'user', parts: [{ text: userMessage }] });

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                if (response.status === 429 || errData.error?.message?.includes('Quota exceeded')) {
                    return '⚠️ 無料枠の送信回数制限に達しました。約1分間待ってから再度送信してくださいませ。';
                }
                return `APIエラー (${response.status}): ${errData.error?.message || '通信に失敗いたしました'}`;
            }

            const data = await response.json();
            
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                return data.candidates[0].content.parts[0].text;
            } else {
                return '⚠️ APIからの応答形式が予期しないものでした。';
            }
        }
    </script>
</body>
</html>
