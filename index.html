<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dashboard & RP Chat</title>
    <style>
        /* 🎨 目に優しいテーマカラー定義 (6種類) */
        :root[data-theme="sage"] {
            --bg-color: #eef2f0;
            --card-bg: #ffffff;
            --panel-bg: #f4f7f5;
            --text-color: #2d3732;
            --primary-color: #52796f;
            --primary-hover: #354f48;
            --user-msg-bg: #52796f;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e0e8e5;
            --model-msg-text: #2d3732;
            --border-color: #cbd5d0;
            --header-bg: #354f48;
        }

        :root[data-theme="sepia"] {
            --bg-color: #f7f4eb;
            --card-bg: #fdfbf7;
            --panel-bg: #f2ede4;
            --text-color: #433831;
            --primary-color: #8c6d58;
            --primary-hover: #6e5443;
            --user-msg-bg: #8c6d58;
            --user-msg-text: #ffffff;
            --model-msg-bg: #eae3d2;
            --model-msg-text: #433831;
            --border-color: #d8cebe;
            --header-bg: #5c4738;
        }

        :root[data-theme="dark"] {
            --bg-color: #1e222a;
            --card-bg: #252a34;
            --panel-bg: #2d333f;
            --text-color: #e1e6ed;
            --primary-color: #61afef;
            --primary-hover: #4b92d4;
            --user-msg-bg: #4b5263;
            --user-msg-text: #ffffff;
            --model-msg-bg: #353b45;
            --model-msg-text: #abb2bf;
            --border-color: #3e4451;
            --header-bg: #181b21;
        }

        :root[data-theme="lavender"] {
            --bg-color: #f3f0f7;
            --card-bg: #ffffff;
            --panel-bg: #f8f6fb;
            --text-color: #332c3d;
            --primary-color: #7b68ee;
            --primary-hover: #6352cb;
            --user-msg-bg: #7b68ee;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e8e3f5;
            --model-msg-text: #332c3d;
            --border-color: #d1c8e8;
            --header-bg: #4a3f8a;
        }

        :root[data-theme="nordic"] {
            --bg-color: #ebf1f5;
            --card-bg: #ffffff;
            --panel-bg: #f1f5f9;
            --text-color: #2b3a4a;
            --primary-color: #457b9d;
            --primary-hover: #1d3557;
            --user-msg-bg: #457b9d;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e1eaf0;
            --model-msg-text: #2b3a4a;
            --border-color: #c0d1dd;
            --header-bg: #1d3557;
        }

        :root[data-theme="neutral"] {
            --bg-color: #f0f0f0;
            --card-bg: #ffffff;
            --panel-bg: #f8f8f8;
            --text-color: #333333;
            --primary-color: #666666;
            --primary-hover: #444444;
            --user-msg-bg: #555555;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e5e5e5;
            --model-msg-text: #333333;
            --border-color: #cccccc;
            --header-bg: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        /* ヘッダー */
        .header {
            background: var(--header-bg);
            color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .theme-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .theme-selector select {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .theme-selector select option {
            background: #ffffff;
            color: #333333;
        }

        .tabs {
            display: flex;
            gap: 5px;
        }

        .tab-btn {
            padding: 8px 14px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: #ffffff;
        }

        /* アプリ本体のコンテンツ */
        .app-body {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 15px;
        }

        .tab-content.active {
            display: flex;
        }

        /* 1画面ダッシュボードレイアウト */
        .dashboard-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

        /* PCサイドバー（カレンダー・ToDo） */
        .sidebar-panel {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .dashboard-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* チャットエリア */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.92rem;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 2px;
        }

        .model-msg {
            align-self: flex-start;
            background-color: var(--model-msg-bg);
            color: var(--model-msg-text);
            border-bottom-left-radius: 2px;
        }

        .msg-header {
            font-size: 0.72rem;
            margin-bottom: 3px;
            opacity: 0.8;
            font-weight: bold;
        }

        .input-area {
            padding: 10px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-area textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--card-bg);
            color: var(--text-color);
            resize: none;
            height: 48px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .btn-main {
            padding: 10px 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            height: 48px;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        /* 共通フォーム＆リスト */
        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.85rem;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .form-row {
            display: flex;
            gap: 6px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .item-card.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .btn-danger {
            background: #e84118;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-sub {
            background: rgba(0,0,0,0.1);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* 質問設定エリア */
        .cat-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 12px;
            padding: 12px;
        }

        .cat-box h3 {
            margin-top: 0;
            font-size: 0.95rem;
            color: var(--primary-color);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px;
        }

        /* レスポンシブ (スマホ向け調整) */
        @media (max-width: 850px) {
            .dashboard-layout {
                flex-direction: column;
            }
            .sidebar-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <div class="theme-selector">
                <label for="themeSelect">🎨 テーマ:</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="sage">🍃 セージミント</option>
                    <option value="sepia">☕ ウォームセピア</option>
                    <option value="dark">🌙 ダークスレート</option>
                    <option value="lavender">🪻 ジェントルラベンダー</option>
                    <option value="nordic">❄️ ノルディックブルー</option>
                    <option value="neutral">🌫️ ニュートラルグレー</option>
                </select>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard-tab')">💬 メイン画面</button>
                <button class="tab-btn" onclick="switchTab('questions-tab')">🎭 RP質問設定</button>
                <button class="tab-btn" onclick="switchTab('basic-tab')">⚙️ API設定</button>
            </div>
        </div>

        <!-- アプリケーション本体 -->
        <div class="app-body">
            
            <!-- 1. メイン画面（1画面ダッシュボード） -->
            <div id="dashboard-tab" class="tab-content active">
                <div class="dashboard-layout">
                    
                    <!-- サイドバー（カレンダー & ToDo） -->
                    <div class="sidebar-panel">
                        
                        <!-- カレンダーカード -->
                        <div class="dashboard-card">
                            <div class="card-title">📅 予定・リマインダー</div>
                            <div class="form-group">
                                <input type="text" id="eventTitle" placeholder="予定のタイトル">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <input type="date" id="eventDate">
                                </div>
                                <div class="form-group">
                                    <input type="time" id="eventTime">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>⏰ 通知タイミング:</label>
                                <select id="eventRemind">
                                    <option value="0">時間ぴったり</option>
                                    <option value="5">5分前</option>
                                    <option value="10">10分前</option>
                                    <option value="15">15分前</option>
                                    <option value="30">30分前</option>
                                    <option value="60">1時間前</option>
                                    <option value="-1">リマインドなし</option>
                                </select>
                            </div>
                            <button class="btn-main" style="margin-bottom:10px; height: auto; padding: 8px;" onclick="addEvent()">予定を追加</button>
                            <ul id="eventList" class="item-list"></ul>
                        </div>

                        <!-- やることリストカード -->
                        <div class="dashboard-card">
                            <div class="card-title">✅ やることリスト (ToDo)</div>
                            <div class="form-row" style="margin-bottom:8px;">
                                <input type="text" id="todoInput" placeholder="新しいタスク..." style="flex:1;">
                                <button class="btn-main" style="height: auto; padding: 8px 12px;" onclick="addTodo()">追加</button>
                            </div>
                            <ul id="todoList" class="item-list"></ul>
                        </div>

                    </div>

                    <!-- チャットエリア -->
                    <div class="chat-area">
                        <div style="padding: 8px 15px; border-bottom: 1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; background:var(--panel-bg);">
                            <span style="font-weight:bold; font-size:0.85rem;" id="chatTitleName">会話ログ</span>
                            <button class="btn-sub" onclick="clearChatHistory()">ログを消去</button>
                        </div>

                        <div class="chat-container" id="chatBox"></div>

                        <div class="input-area">
                            <textarea id="userInput" placeholder="メッセージを入力... (Enterで送信, Shift+Enterで改行)" onkeydown="handleKeyDown(event)"></textarea>
                            <button class="btn-main" onclick="sendMessage()">送信</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 2. RP質問設定タブ -->
            <div id="questions-tab" class="tab-content" style="flex-direction:column;">
                <div class="card-title" style="font-size:1.1rem;">🎭 キャラクタープロファイル設定 (RP反映)</div>
                
                <!-- 呼称の基本設定 -->
                <div class="cat-box">
                    <h3>👤 呼称・基本情報</h3>
                    <div class="q-grid">
                        <div class="form-group">
                            <label>キャラクター名:</label>
                            <input type="text" id="charNameInput" value="エリザベス" onchange="saveBasicCharInfo()">
                        </div>
                        <div class="form-group">
                            <label>一人称 (例: 私, ボク, 俺):</label>
                            <input type="text" id="charFirstPerson" value="私" placeholder="私" onchange="saveBasicCharInfo()">
                        </div>
                        <div class="form-group">
                            <label>二人称 (例: あなた, 君, お前):</label>
                            <input type="text" id="charSecondPerson" value="あなた" placeholder="あなた" onchange="saveBasicCharInfo()">
                        </div>
                        <div class="form-group">
                            <label>ユーザーの呼び方 (例: ご主人様, ○○さん):</label>
                            <input type="text" id="charUserCall" value="ご主人様" placeholder="ご主人様" onchange="saveBasicCharInfo()">
                        </div>
                    </div>
                </div>

                <div id="questionsContainer"></div>

                <button class="btn-main" style="padding:12px; margin-top:10px; height:auto;" onclick="saveAllQuestions()">設定をすべて保存して反映</button>
            </div>

            <!-- 3. API接続設定タブ -->
            <div id="basic-tab" class="tab-content" style="flex-direction:column; max-width:500px;">
                <div class="card-title" style="font-size:1.1rem;">⚙️ API 接続設定</div>
                <div class="form-group" style="margin-top:10px;">
                    <label>Gemini APIキー:</label>
                    <input type="password" id="apiKeyInput" placeholder="APIキーを入力">
                </div>
                <div class="form-group">
                    <label>使用モデル名:</label>
                    <input type="text" id="modelNameInput" value="gemini-2.5-flash" placeholder="gemini-2.5-flash">
                </div>
                <button class="btn-main" style="margin-top:10px; height:auto;" onclick="saveApiSettings()">設定を保存</button>
            </div>

        </div>
    </div>

    <script>
        // 質問カテゴリー定義
        const questionCategories = {
            '基本属性': {
                'age': '年齢または年代は？',
                'gender': '性別または性自認は？',
                'occupation': '職業や立場は？',
                'birthplace': '出身地や住んでいる地域は？',
                'appearance': '身長や体格の特徴は？',
                'features': '外見的な特徴（髪型、目の色など）は？',
                'firstImpression': '第一印象でどのような人に見えますか？',
                'hobbies': '趣味は何ですか？（3-5個）',
                'strengths': '得意なことは何ですか？'
            },
            '性格・気質': {
                'temperament': '基本的な性格は明るい方ですか、それとも落ち着いている方ですか？',
                'sociability': '社交的ですか、それとも内向的ですか？',
                'perfectionism': '完璧主義者ですか、それとものんびり屋ですか？',
                'logic': '論理的ですか、それとも直感的ですか？',
                'decisiveness': '優柔不断ですか、それとも決断力がありますか？',
                'outlook': 'プラス思考ですか、それともマイナス思考ですか？',
                'impulsive': '衝動的ですか、それとも慎重ですか？',
                'humor': 'ユーモア好きですか？どのような冗談を好みますか？',
                'tidiness': '几帳面ですか、それとも大雑把ですか？',
                'emotions': '感情的になりやすいですか？'
            },
            '口調・言語表現': {
                'basicTone': '話すときの基本的な口調は敬語ですか、それともカジュアルですか？',
                'catchphrases': 'よく使う口癖はありますか？',
                'endingParticles': '語尾の特徴は？',
                'politePeople': '丁寧に話しかけてくる人にはどう返しますか？',
                'closeFriends': '親しい人にはどのように話しかけますか？',
                'laughs': 'よく笑いますか？',
                'talkLength': '話が長いですか、それとも短くまとめますか？'
            }
        };

        let chatHistory = []; // API用コンテキスト
        let chatLogs = [];    // 画面表示・保存用ログ
        let calendarEvents = [];
        let todoList = [];

        window.onload = function() {
            loadSavedData();
            buildQuestionsUI();
            renderCalendar();
            renderTodo();
            renderChatLogs();

            // 10秒ごとにリマインダーをチェック
            setInterval(checkReminders, 10000);
        };

        // テーマ切り替え
        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('geminiAppTheme', themeName);
        }

        // タブ切り替え
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 保存データ読み込み
        function loadSavedData() {
            const savedTheme = localStorage.getItem('geminiAppTheme') || 'sage';
            document.getElementById('themeSelect').value = savedTheme;
            changeTheme(savedTheme);

            document.getElementById('apiKeyInput').value = localStorage.getItem('geminiApiKey') || '';
            document.getElementById('modelNameInput').value = localStorage.getItem('geminiModelName') || 'gemini-2.5-flash';
            
            document.getElementById('charNameInput').value = localStorage.getItem('geminiCharName') || 'エリザベス';
            document.getElementById('charFirstPerson').value = localStorage.getItem('geminiCharFirstPerson') || '私';
            document.getElementById('charSecondPerson').value = localStorage.getItem('geminiCharSecondPerson') || 'あなた';
            document.getElementById('charUserCall').value = localStorage.getItem('geminiCharUserCall') || 'ご主人様';

            calendarEvents = JSON.parse(localStorage.getItem('geminiCalendarEvents') || '[]');
            todoList = JSON.parse(localStorage.getItem('geminiTodoList') || '[]');
            chatLogs = JSON.parse(localStorage.getItem('geminiChatLogs') || '[]');

            // チャット初期メッセージがない場合のデフォルト
            if (chatLogs.length === 0) {
                const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
                const userCall = localStorage.getItem('geminiCharUserCall') || 'ご主人様';
                chatLogs.push({
                    sender: 'model',
                    name: charName,
                    text: `${userCall}、準備が整いましたわ。カレンダーやToDoの確認、あるいは何なりとお話しくださいませ。`
                });
                saveChatLogs();
            }
        }

        function saveApiSettings() {
            localStorage.setItem('geminiApiKey', document.getElementById('apiKeyInput').value.trim());
            localStorage.setItem('geminiModelName', document.getElementById('modelNameInput').value.trim() || 'gemini-2.5-flash');
            alert('API設定を保存いたしました。');
        }

        function saveBasicCharInfo() {
            const name = document.getElementById('charNameInput').value.trim() || 'エリザベス';
            localStorage.setItem('geminiCharName', name);
            localStorage.setItem('geminiCharFirstPerson', document.getElementById('charFirstPerson').value.trim() || '私');
            localStorage.setItem('geminiCharSecondPerson', document.getElementById('charSecondPerson').value.trim() || 'あなた');
            localStorage.setItem('geminiCharUserCall', document.getElementById('charUserCall').value.trim() || 'ご主人様');
            document.getElementById('chatTitleName').innerText = `会話ログ (${name})`;
        }

        // 質問UI自動生成
        function buildQuestionsUI() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            const savedAnswers = JSON.parse(localStorage.getItem('geminiCharAnswers') || '{}');

            for (const [catName, questions] of Object.entries(questionCategories)) {
                const box = document.createElement('div');
                box.className = 'cat-box';
                
                let html = `<h3>${catName}</h3><div class="q-grid">`;
                for (const [qKey, qLabel] of Object.entries(questions)) {
                    const val = savedAnswers[qKey] || '';
                    html += `
                        <div class="form-group">
                            <label>${qLabel}</label>
                            <input type="text" class="q-input" data-qkey="${qKey}" value="${escapeHtml(val)}" placeholder="未設定">
                        </div>
                    `;
                }
                html += `</div>`;
                box.innerHTML = html;
                container.appendChild(box);
            }
        }

        function saveAllQuestions() {
            saveBasicCharInfo();
            const inputs = document.querySelectorAll('.q-input');
            const answers = {};
            inputs.forEach(input => {
                const key = input.getAttribute('data-qkey');
                const val = input.value.trim();
                if (val) answers[key] = val;
            });
            localStorage.setItem('geminiCharAnswers', JSON.stringify(answers));
            alert('✨ プロファイルと呼称設定をすべて反映いたしましたわ！');
        }

        // --- カレンダー & リマインダー ---
        function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const remindMinutes = parseInt(document.getElementById('eventRemind').value);

            if (!title || !date) return alert('タイトルと日付を入力してください。');

            calendarEvents.push({
                id: Date.now(),
                title,
                date,
                time,
                remindMinutes,
                reminded: false
            });

            calendarEvents.sort((a,b) => new Date(a.date + ' ' + (a.time||'00:00')) - new Date(b.date + ' ' + (b.time||'00:00')));
            localStorage.setItem('geminiCalendarEvents', JSON.stringify(calendarEvents));
            renderCalendar();

            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
        }

        function deleteEvent(id) {
            calendarEvents = calendarEvents.filter(e => e.id !== id);
            localStorage.setItem('geminiCalendarEvents', JSON.stringify(calendarEvents));
            renderCalendar();
        }

        function renderCalendar() {
            const list = document.getElementById('eventList');
            list.innerHTML = '';
            if (calendarEvents.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size:0.8rem;">予定はありません。</li>';
                return;
            }
            calendarEvents.forEach(e => {
                const li = document.createElement('li');
                li.className = 'item-card';
                const remindText = e.remindMinutes === -1 ? '' : (e.remindMinutes === 0 ? ' [通知:時間通り]' : ` [通知:${e.remindMinutes}分前]`);
                li.innerHTML = `
                    <div>
                        <strong>📅 ${escapeHtml(e.date)} ${e.time ? escapeHtml(e.time) : ''}</strong>
                        <div>${escapeHtml(e.title)} <span style="font-size:0.75rem; opacity:0.7;">${remindText}</span></div>
                    </div>
                    <button class="btn-danger" onclick="deleteEvent(${e.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        // リマインダー監視処理
        function checkReminders() {
            if (calendarEvents.length === 0) return;

            const now = new Date();
            const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
            const userCall = localStorage.getItem('geminiCharUserCall') || 'ご主人様';
            let updated = false;

            calendarEvents.forEach(e => {
                if (e.reminded || e.remindMinutes === -1 || !e.time) return;

                const eventTime = new Date(`${e.date}T${e.time}`);
                const remindTime = new Date(eventTime.getTime() - (e.remindMinutes * 60 * 1000));

                // リマインド時刻を過ぎており、かつ予定時刻から1時間以内であれば通知
                if (now >= remindTime && now < new Date(eventTime.getTime() + 3600000)) {
                    e.reminded = true;
                    updated = true;

                    const msg = `⏰ 【お時間のリマインド】\n${userCall}、予定「${e.title}」（${e.date} ${e.time}）のお時間が近づいておりますわ！`;
                    addChatMessage('model', charName, msg);
                }
            });

            if (updated) {
                localStorage.setItem('geminiCalendarEvents', JSON.stringify(calendarEvents));
            }
        }

        // --- ToDo ---
        function addTodo() {
            const text = document.getElementById('todoInput').value.trim();
            if (!text) return;

            todoList.push({ id: Date.now(), text, completed: false });
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
            document.getElementById('todoInput').value = '';
        }

        function toggleTodo(id) {
            const item = todoList.find(t => t.id === id);
            if (item) item.completed = !item.completed;
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
        }

        function deleteTodo(id) {
            todoList = todoList.filter(t => t.id !== id);
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
        }

        function renderTodo() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            if (todoList.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size:0.8rem;">タスクはありません。</li>';
                return;
            }
            todoList.forEach(t => {
                const li = document.createElement('li');
                li.className = `item-card ${t.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div style="cursor:pointer;" onclick="toggleTodo(${t.id})">
                        <input type="checkbox" ${t.completed ? 'checked' : ''}>
                        <span>${escapeHtml(t.text)}</span>
                    </div>
                    <button class="btn-danger" onclick="deleteTodo(${t.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        // --- チャット処理 & ログ保存 ---
        function handleKeyDown(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Shift + Enter で改行
                    return;
                } else {
                    // Enter 単体で送信
                    e.preventDefault();
                    sendMessage();
                }
            }
        }

        function saveChatLogs() {
            localStorage.setItem('geminiChatLogs', JSON.stringify(chatLogs));
        }

        function renderChatLogs() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            chatLogs.forEach(msg => {
                appendMessageToDOM(msg.sender, msg.name, msg.text);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addChatMessage(sender, name, text) {
            chatLogs.push({ sender, name, text });
            saveChatLogs();
            appendMessageToDOM(sender, name, text);
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChatHistory() {
            if (confirm('会話ログを消去してもよろしいですか？')) {
                chatLogs = [];
                chatHistory = [];
                saveChatLogs();
                renderChatLogs();
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
            addChatMessage('user', 'あなた', text);
            inputEl.value = '';

            const loadingId = appendLoadingMessage(charName);

            try {
                const reply = await callGeminiAPI(text);
                removeMessage(loadingId);
                addChatMessage('model', charName, reply);

                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'model', content: reply });
            } catch (err) {
                removeMessage(loadingId);
                addChatMessage('model', 'システム', `⚠️ エラーが発生いたしました:\n${err.message}`);
            }
        }

        function appendMessageToDOM(sender, name, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'model-msg'}`;
            msgDiv.innerHTML = `<div class="msg-header">${escapeHtml(name)}</div><div>${escapeHtml(text)}</div>`;
            chatBox.appendChild(msgDiv);
        }

        function appendLoadingMessage(name) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            const id = 'loading-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = 'message model-msg';
            msgDiv.style.fontStyle = 'italic';
            msgDiv.style.opacity = '0.7';
            msgDiv.innerText = `${name}が考えています...`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function buildSystemPrompt() {
            const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
            const firstPerson = localStorage.getItem('geminiCharFirstPerson') || '私';
            const secondPerson = localStorage.getItem('geminiCharSecondPerson') || 'あなた';
            const userCall = localStorage.getItem('geminiCharUserCall') || 'ご主人様';
            
            const savedAnswers = JSON.parse(localStorage.getItem('geminiCharAnswers') || '{}');

            let rpSettings = '';
            for (const [catName, questions] of Object.entries(questionCategories)) {
                let catDetails = [];
                for (const [qKey, qLabel] of Object.entries(questions)) {
                    if (savedAnswers[qKey]) {
                        catDetails.push(`・${qLabel} → ${savedAnswers[qKey]}`);
                    }
                }
                if (catDetails.length > 0) {
                    rpSettings += `\n【${catName}】\n` + catDetails.join('\n');
                }
            }

            const upcomingEvents = calendarEvents.map(e => `${e.date} ${e.time||''}: ${e.title}`).join(' / ');
            const pendingTodos = todoList.filter(t => !t.completed).map(t => t.text).join(' / ');

            return `あなたは${charName}というキャラクターです。

以下はあなた（${charName}）の口調・呼称設定です。必ず遵守してください：
・自分の名前: ${charName}
・一人称: ${firstPerson}
・二人称: ${secondPerson}
・ユーザーの呼び方: ${userCall}

【背景設定・回答プロファイル】
${rpSettings || '（特別なプロファイル未設定）'}

【現在の共有情報】
・登録されている予定: ${upcomingEvents || 'なし'}
・未完了のToDo: ${pendingTodos || 'なし'}

ユーザーからの問いかけに対し、上記の設定・一人称・二人称・呼び方を徹底的に守り、魅力的になりきって返答してください。`;
        }

        async function callGeminiAPI(userMessage) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) {
                return 'Gemini APIキーが設定されていません。「API設定」タブでキーを入力・保存してくださいませ。';
            }

            const modelName = localStorage.getItem('geminiModelName') || 'gemini-2.5-flash';
            const systemPrompt = buildSystemPrompt();

            const contents = [
                { role: 'user', parts: [{ text: `[システム指定・キャラクタープロファイル]\n${systemPrompt}` }] },
                { role: 'model', parts: [{ text: `了解いたしました。設定された一人称・二人称・呼び方を守り、完璧になりきってお話しいたします。` }] }
            ];

            // 直近の会話文脈を反映
            chatLogs.slice(-8).forEach(msg => {
                contents.push({
                    role: msg.sender === 'user' ? 'user' : 'model',
                    parts: [{ text: msg.text }]
                });
            });

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                return `APIエラー (${response.status}): ${errData.error?.message || '通信に失敗いたしました'}`;
            }

            const data = await response.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                return data.candidates[0].content.parts[0].text;
            } else {
                return '⚠️ 応答メッセージを取得できませんでした。';
            }
        }
    </script>
