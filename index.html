<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dashboard & RP Chat</title>
    <style>
        /* 🎨 目に優しいテーマカラー定義 (6種類) */
        :root[data-theme="sage"] {
            --bg-color: #eef2f0;
            --card-bg: #ffffff;
            --panel-bg: #f4f7f5;
            --text-color: #2d3732;
            --primary-color: #52796f;
            --primary-hover: #354f48;
            --user-msg-bg: #52796f;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e0e8e5;
            --model-msg-text: #2d3732;
            --border-color: #cbd5d0;
            --header-bg: #354f48;
        }

        :root[data-theme="sepia"] {
            --bg-color: #f7f4eb;
            --card-bg: #fdfbf7;
            --panel-bg: #f2ede4;
            --text-color: #433831;
            --primary-color: #8c6d58;
            --primary-hover: #6e5443;
            --user-msg-bg: #8c6d58;
            --user-msg-text: #ffffff;
            --model-msg-bg: #eae3d2;
            --model-msg-text: #433831;
            --border-color: #d8cebe;
            --header-bg: #5c4738;
        }

        :root[data-theme="dark"] {
            --bg-color: #1e222a;
            --card-bg: #252a34;
            --panel-bg: #2d333f;
            --text-color: #e1e6ed;
            --primary-color: #61afef;
            --primary-hover: #4b92d4;
            --user-msg-bg: #4b5263;
            --user-msg-text: #ffffff;
            --model-msg-bg: #353b45;
            --model-msg-text: #abb2bf;
            --border-color: #3e4451;
            --header-bg: #181b21;
        }

        :root[data-theme="lavender"] {
            --bg-color: #f3f0f7;
            --card-bg: #ffffff;
            --panel-bg: #f8f6fb;
            --text-color: #332c3d;
            --primary-color: #7b68ee;
            --primary-hover: #6352cb;
            --user-msg-bg: #7b68ee;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e8e3f5;
            --model-msg-text: #332c3d;
            --border-color: #d1c8e8;
            --header-bg: #4a3f8a;
        }

        :root[data-theme="nordic"] {
            --bg-color: #ebf1f5;
            --card-bg: #ffffff;
            --panel-bg: #f1f5f9;
            --text-color: #2b3a4a;
            --primary-color: #457b9d;
            --primary-hover: #1d3557;
            --user-msg-bg: #457b9d;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e1eaf0;
            --model-msg-text: #2b3a4a;
            --border-color: #c0d1dd;
            --header-bg: #1d3557;
        }

        :root[data-theme="neutral"] {
            --bg-color: #f0f0f0;
            --card-bg: #ffffff;
            --panel-bg: #f8f8f8;
            --text-color: #333333;
            --primary-color: #666666;
            --primary-hover: #444444;
            --user-msg-bg: #555555;
            --user-msg-text: #ffffff;
            --model-msg-bg: #e5e5e5;
            --model-msg-text: #333333;
            --border-color: #cccccc;
            --header-bg: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        /* ヘッダー */
        .header {
            background: var(--header-bg);
            color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .theme-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .theme-selector select {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .theme-selector select option {
            background: #ffffff;
            color: #333333;
        }

        .tabs {
            display: flex;
            gap: 5px;
        }

        .tab-btn {
            padding: 8px 14px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: #ffffff;
        }

        /* アプリ本体のコンテンツ */
        .app-body {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 15px;
        }

        .tab-content.active {
            display: flex;
        }

        /* 1画面ダッシュボードレイアウト */
        .dashboard-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

        /* PCサイドバー（カレンダー・ToDo） */
        .sidebar-panel {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .dashboard-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 4px;
        }

        /* チャットエリア */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.92rem;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 2px;
        }

        .model-msg {
            align-self: flex-start;
            background-color: var(--model-msg-bg);
            color: var(--model-msg-text);
            border-bottom-left-radius: 2px;
        }

        .msg-header {
            font-size: 0.72rem;
            margin-bottom: 3px;
            opacity: 0.8;
            font-weight: bold;
        }

        .input-area {
            padding: 12px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .btn-main {
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        /* 共通フォーム＆リスト */
        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.85rem;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .form-row {
            display: flex;
            gap: 6px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .item-card.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .btn-danger {
            background: #e84118;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* 質問設定エリア */
        .cat-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 12px;
            padding: 12px;
        }

        .cat-box h3 {
            margin-top: 0;
            font-size: 0.95rem;
            color: var(--primary-color);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px;
        }

        /* レスポンシブ (スマホ向け調整) */
        @media (max-width: 850px) {
            .dashboard-layout {
                flex-direction: column;
            }
            .sidebar-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <div class="theme-selector">
                <label for="themeSelect">🎨 テーマ:</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="sage">🍃 セージミント</option>
                    <option value="sepia">☕ ウォームセピア</option>
                    <option value="dark">🌙 ダークスレート</option>
                    <option value="lavender">🪻 ジェントルラベンダー</option>
                    <option value="nordic">❄️ ノルディックブルー</option>
                    <option value="neutral">🌫️ ニュートラルグレー</option>
                </select>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard-tab')">💬 メイン画面</button>
                <button class="tab-btn" onclick="switchTab('questions-tab')">🎭 RP質問設定</button>
                <button class="tab-btn" onclick="switchTab('basic-tab')">⚙️ API設定</button>
            </div>
        </div>

        <!-- アプリケーション本体 -->
        <div class="app-body">
            
            <!-- 1. メイン画面（1画面ダッシュボード） -->
            <div id="dashboard-tab" class="tab-content active">
                <div class="dashboard-layout">
                    
                    <!-- サイドバー（カレンダー & ToDo） -->
                    <div class="sidebar-panel">
                        
                        <!-- カレンダーカード -->
                        <div class="dashboard-card">
                            <div class="card-title">📅 予定・リマインダー</div>
                            <div class="form-group">
                                <input type="text" id="eventTitle" placeholder="予定のタイトル">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <input type="date" id="eventDate">
                                </div>
                                <div class="form-group">
                                    <input type="time" id="eventTime">
                                </div>
                            </div>
                            <button class="btn-main" style="margin-bottom:10px;" onclick="addEvent()">予定を追加</button>
                            <ul id="eventList" class="item-list"></ul>
                        </div>

                        <!-- やることリストカード -->
                        <div class="dashboard-card">
                            <div class="card-title">✅ やることリスト (ToDo)</div>
                            <div class="form-row" style="margin-bottom:8px;">
                                <input type="text" id="todoInput" placeholder="新しいタスク..." style="flex:1;">
                                <button class="btn-main" onclick="addTodo()">追加</button>
                            </div>
                            <ul id="todoList" class="item-list"></ul>
                        </div>

                    </div>

                    <!-- チャットエリア -->
                    <div class="chat-area">
                        <div class="chat-container" id="chatBox">
                            <div class="message model-msg">
                                <div class="msg-header" id="welcomeCharName">エリザベス</div>
                                <div>ご主人様、準備が整いましたわ。カレンダーやToDoの確認、あるいは何なりとお話しくださいませ。</div>
                            </div>
                        </div>
                        <div class="input-area">
                            <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
                            <button class="btn-main" onclick="sendMessage()">送信</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 2. RP質問設定タブ -->
            <div id="questions-tab" class="tab-content" style="flex-direction:column;">
                <div class="card-title" style="font-size:1.1rem;">🎭 キャラクタープロファイル設定 (RP反映)</div>
                <p style="font-size:0.85rem; opacity:0.8; margin-top:-5px;">ここで回答された内容はAIに読み込まれ、口調や性格にしっかり反映されますわ。</p>
                
                <div class="form-group" style="max-width:300px; margin-bottom:15px;">
                    <label>キャラクター名 (基本設定):</label>
                    <input type="text" id="charNameInput" value="エリザベス" onchange="saveBasicCharInfo()">
                </div>

                <div id="questionsContainer"></div>

                <button class="btn-main" style="padding:12px; margin-top:10px;" onclick="saveAllQuestions()">質問設定を保存して反映</button>
            </div>

            <!-- 3. API接続設定タブ -->
            <div id="basic-tab" class="tab-content" style="flex-direction:column; max-width:500px;">
                <div class="card-title" style="font-size:1.1rem;">⚙️ API 接続設定</div>
                <div class="form-group" style="margin-top:10px;">
                    <label>Gemini APIキー:</label>
                    <input type="password" id="apiKeyInput" placeholder="APIキーを入力">
                </div>
                <div class="form-group">
                    <label>使用モデル名:</label>
                    <input type="text" id="modelNameInput" value="gemini-2.5-flash" placeholder="gemini-2.5-flash">
                </div>
                <button class="btn-main" style="margin-top:10px;" onclick="saveApiSettings()">設定を保存</button>
            </div>

        </div>
    </div>

                'season': '好きな季節は？',

                'smell': '好きな匂いは？',

        let chatHistory = [];
        let calendarEvents = [];
        let todoList = [];

        window.onload = function() {
            loadSavedData();
            buildQuestionsUI();
            renderCalendar();
            renderTodo();
        };

        // テーマ切り替え
        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('geminiAppTheme', themeName);
        }

        // タブ切り替え
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 保存データ読み込み
        function loadSavedData() {
            const savedTheme = localStorage.getItem('geminiAppTheme') || 'sage';
            document.getElementById('themeSelect').value = savedTheme;
            changeTheme(savedTheme);

            document.getElementById('apiKeyInput').value = localStorage.getItem('geminiApiKey') || '';
            document.getElementById('modelNameInput').value = localStorage.getItem('geminiModelName') || 'gemini-2.5-flash';
            document.getElementById('charNameInput').value = localStorage.getItem('geminiCharName') || 'エリザベス';
            document.getElementById('welcomeCharName').innerText = localStorage.getItem('geminiCharName') || 'エリザベス';

            calendarEvents = JSON.parse(localStorage.getItem('geminiCalendarEvents') || '[]');
            todoList = JSON.parse(localStorage.getItem('geminiTodoList') || '[]');
        }

        function saveApiSettings() {
            localStorage.setItem('geminiApiKey', document.getElementById('apiKeyInput').value.trim());
            localStorage.setItem('geminiModelName', document.getElementById('modelNameInput').value.trim() || 'gemini-2.5-flash');
            alert('API設定を保存いたしました。');
        }

        function saveBasicCharInfo() {
            const name = document.getElementById('charNameInput').value.trim() || 'エリザベス';
            localStorage.setItem('geminiCharName', name);
            document.getElementById('welcomeCharName').innerText = name;
        }

        // 質問UI自動生成
        function buildQuestionsUI() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            const savedAnswers = JSON.parse(localStorage.getItem('geminiCharAnswers') || '{}');

            for (const [catName, questions] of Object.entries(questionCategories)) {
                const box = document.createElement('div');
                box.className = 'cat-box';
                
                let html = `<h3>${catName}</h3><div class="q-grid">`;
                for (const [qKey, qLabel] of Object.entries(questions)) {
                    const val = savedAnswers[qKey] || '';
                    html += `
                        <div class="form-group">
                            <label>${qLabel}</label>
                            <input type="text" class="q-input" data-qkey="${qKey}" value="${escapeHtml(val)}" placeholder="未設定">
                        </div>
                    `;
                }
                html += `</div>`;
                box.innerHTML = html;
                container.appendChild(box);
            }
        }

        function saveAllQuestions() {
            saveBasicCharInfo();
            const inputs = document.querySelectorAll('.q-input');
            const answers = {};
            inputs.forEach(input => {
                const key = input.getAttribute('data-qkey');
                const val = input.value.trim();
                if (val) answers[key] = val;
            });
            localStorage.setItem('geminiCharAnswers', JSON.stringify(answers));
            alert('✨ 質問設定を保存し、AIに反映いたしましたわ！');
        }

        // --- カレンダー ---
        function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;

            if (!title || !date) return alert('タイトルと日付を入力してください。');

            calendarEvents.push({ id: Date.now(), title, date, time });
            calendarEvents.sort((a,b) => new Date(a.date + ' ' + (a.time||'00:00')) - new Date(b.date + ' ' + (b.time||'00:00')));
            
            localStorage.setItem('geminiCalendarEvents', JSON.stringify(calendarEvents));
            renderCalendar();

            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
        }

        function deleteEvent(id) {
            calendarEvents = calendarEvents.filter(e => e.id !== id);
            localStorage.setItem('geminiCalendarEvents', JSON.stringify(calendarEvents));
            renderCalendar();
        }

        function renderCalendar() {
            const list = document.getElementById('eventList');
            list.innerHTML = '';
            if (calendarEvents.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size:0.8rem;">予定はありません。</li>';
                return;
            }
            calendarEvents.forEach(e => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <strong>📅 ${escapeHtml(e.date)} ${e.time ? escapeHtml(e.time) : ''}</strong>
                        <div>${escapeHtml(e.title)}</div>
                    </div>
                    <button class="btn-danger" onclick="deleteEvent(${e.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        // --- ToDo ---
        function addTodo() {
            const text = document.getElementById('todoInput').value.trim();
            if (!text) return;

            todoList.push({ id: Date.now(), text, completed: false });
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
            document.getElementById('todoInput').value = '';
        }

        function toggleTodo(id) {
            const item = todoList.find(t => t.id === id);
            if (item) item.completed = !item.completed;
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
        }

        function deleteTodo(id) {
            todoList = todoList.filter(t => t.id !== id);
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
        }

        function renderTodo() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            if (todoList.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size:0.8rem;">タスクはありません。</li>';
                return;
            }
            todoList.forEach(t => {
                const li = document.createElement('li');
                li.className = `item-card ${t.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div style="cursor:pointer;" onclick="toggleTodo(${t.id})">
                        <input type="checkbox" ${t.completed ? 'checked' : ''}>
                        <span>${escapeHtml(t.text)}</span>
                    </div>
                    <button class="btn-danger" onclick="deleteTodo(${t.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        // --- チャット処理 ---
        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
            appendMessage('user', 'あなた', text);
            inputEl.value = '';

            const loadingId = appendLoadingMessage(charName);

            try {
                const reply = await callGeminiAPI(text);
                removeMessage(loadingId);
                appendMessage('model', charName, reply);

                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'model', content: reply });
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('model', 'システム', `⚠️ エラーが発生いたしました:\n${err.message}`);
            }
        }

        function appendMessage(sender, name, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'model-msg'}`;
            msgDiv.innerHTML = `<div class="msg-header">${escapeHtml(name)}</div><div>${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendLoadingMessage(name) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            const id = 'loading-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = 'message model-msg';
            msgDiv.style.fontStyle = 'italic';
            msgDiv.style.opacity = '0.7';
            msgDiv.innerText = `${name}が考えています...`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function buildSystemPrompt() {
            const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
            const savedAnswers = JSON.parse(localStorage.getItem('geminiCharAnswers') || '{}');

            let rpSettings = '';
            for (const [catName, questions] of Object.entries(questionCategories)) {
                let catDetails = [];
                for (const [qKey, qLabel] of Object.entries(questions)) {
                    if (savedAnswers[qKey]) {
                        catDetails.push(`・${qLabel} → ${savedAnswers[qKey]}`);
                    }
                }
                if (catDetails.length > 0) {
                    rpSettings += `\n【${catName}】\n` + catDetails.join('\n');
                }
            }

            const upcomingEvents = calendarEvents.map(e => `${e.date} ${e.time||''}: ${e.title}`).join(' / ');
            const pendingTodos = todoList.filter(t => !t.completed).map(t => t.text).join(' / ');

            return `あなたは${charName}というキャラクターです。

以下はあなた（${charName}）の背景設定・属性・回答設定です。これらの性格・口調・価値観を徹底的に反映して対話し、なりきってください：
${rpSettings || '（特別なプロファイル未設定）'}

【現在の共有情報】
・登録されている予定: ${upcomingEvents || 'なし'}
・未完了のToDo: ${pendingTodos || 'なし'}

ユーザーからの問いかけに対し、必要に応じてカレンダーの予定やToDoにも触れつつ、上記キャラクターとして自然で魅力的な返答をしてください。`;
        }

        async function callGeminiAPI(userMessage) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) {
                return 'Gemini APIキーが設定されていません。「API設定」タブでキーを入力・保存してくださいませ。';
            }

            const modelName = localStorage.getItem('geminiModelName') || 'gemini-2.5-flash';
            const systemPrompt = buildSystemPrompt();

            const contents = [
                { role: 'user', parts: [{ text: `[システム指定・キャラクタープロファイル]\n${systemPrompt}` }] },
                { role: 'model', parts: [{ text: `了解いたしました。プロファイルに基づき完璧になりきってお話しいたします。` }] }
            ];

            chatHistory.slice(-6).forEach(msg => {
                contents.push({
                    role: msg.role === 'user' ? 'user' : 'model',
                    parts: [{ text: msg.content }]
                });
            });

            contents.push({ role: 'user', parts: [{ text: userMessage }] });

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                return `APIエラー (${response.status}): ${errData.error?.message || '通信に失敗いたしました'}`;
            }

            const data = await response.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                return data.candidates[0].content.parts[0].text;
            } else {
                return '⚠️ 応答メッセージを取得できませんでした。';
            }
        }
    </script>
