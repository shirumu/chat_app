<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI アシスタント & RP チャット</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary-color: #4a69bd;
            --primary-hover: #3c5496;
            --accent-color: #e1b12c;
            --danger-color: #e84118;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 92vh;
        }

        /* ヘッダー＆タブ */
        .header {
            background: #2f3542;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            background: #57606f;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            min-width: 110px;
            padding: 12px 8px;
            border: none;
            background: transparent;
            color: #dcdde1;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #2f3542;
            border-bottom-color: var(--primary-color);
        }

        /* コンテンツ表示エリア */
        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* チャット */
        #chat-tab {
            padding: 0;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--primary-color);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .model-msg {
            align-self: flex-start;
            background-color: #f1f2f6;
            color: #2f3542;
            border-bottom-left-radius: 2px;
        }

        .msg-header {
            font-size: 0.75rem;
            margin-bottom: 4px;
            opacity: 0.8;
            font-weight: bold;
        }

        .input-area {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-main {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        /* 共通フォームスタイル */
        .section-title {
            font-size: 1.05rem;
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
            margin-top: 15px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: #485460;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* カレンダー・ToDo・質問設定リスト */
        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-card {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-card.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* アコーディオン・質問カテゴリー */
        .cat-box {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
        }

        .cat-box h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #2f3542;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .loading-dots {
            font-style: italic;
            color: #747d8c;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>Gemini AI 統合パートナー</h1>
        </div>

        <!-- タブナビゲーション -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chat-tab')">💬 チャット</button>
            <button class="tab-btn" onclick="switchTab('calendar-tab')">📅 カレンダー</button>
            <button class="tab-btn" onclick="switchTab('todo-tab')">✅ やること</button>
            <button class="tab-btn" onclick="switchTab('questions-tab')">🎭 RP質問設定</button>
            <button class="tab-btn" onclick="switchTab('basic-tab')">⚙️ API設定</button>
        </div>

        <!-- 1. チャットタブ -->
        <div id="chat-tab" class="tab-content active">
            <div class="chat-container" id="chatBox">
                <div class="message model-msg">
                    <div class="msg-header" id="welcomeCharName">エリザベス</div>
                    <div>ご主人様、準備が整いましたわ。カレンダーやToDoの確認、あるいは何なりとお話しくださいませ。</div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-main" onclick="sendMessage()">送信</button>
            </div>
        </div>

        <!-- 2. カレンダー・リマインダー タブ -->
        <div id="calendar-tab" class="tab-content">
            <div class="section-title">📅 予定＆リマインダーの追加</div>
            <div class="form-row">
                <div class="form-group">
                    <label>予定タイトル:</label>
                    <input type="text" id="eventTitle" placeholder="例: 書籍の打合せ">
                </div>
                <div class="form-group">
                    <label>日付:</label>
                    <input type="date" id="eventDate">
                </div>
                <div class="form-group">
                    <label>時間:</label>
                    <input type="time" id="eventTime">
                </div>
            </div>
            <button class="btn-main" onclick="addEvent()">予定を追加</button>

            <div class="section-title">登録済みの予定一覧</div>
            <ul id="eventList" class="item-list"></ul>
        </div>

        <!-- 3. やることリスト（ToDo）タブ -->
        <div id="todo-tab" class="tab-content">
            <div class="section-title">✅ 新しいタスクを追加</div>
            <div class="form-row">
                <div class="form-group" style="flex:3;">
                    <input type="text" id="todoInput" placeholder="やることを入力...">
                </div>
                <div class="form-group" style="flex:1;">
                    <button class="btn-main" style="width:100%;" onclick="addTodo()">追加</button>
                </div>
            </div>

            <div class="section-title">タスク一覧</div>
            <ul id="todoList" class="item-list"></ul>
        </div>

        <!-- 4. RP質問設定タブ -->
        <div id="questions-tab" class="tab-content">
            <div class="section-title">🎭 キャラクター詳細プロファイル（RP反映用）</div>
            <p style="font-size:0.85rem; color:#666;">ここで回答を入力した項目は、AIが返信を作成する際に背景設定や口調として強く意識しますわ。</p>
            
            <div class="form-group">
                <label>キャラクター名 (基本設定):</label>
                <input type="text" id="charNameInput" value="エリザベス" onchange="saveBasicCharInfo()">
            </div>

            <div id="questionsContainer"></div>

            <button class="btn-main" style="margin-top:15px; padding:12px;" onclick="saveAllQuestions()">質問回答を保存してAIに反映</button>
        </div>

        <!-- 5. API基本設定タブ -->
        <div id="basic-tab" class="tab-content">
            <div class="section-title">⚙️ 接続設定</div>
            <div class="form-group">
                <label>Gemini APIキー:</label>
                <input type="password" id="apiKeyInput" placeholder="APIキーを入力">
            </div>
            <div class="form-group">
                <label>使用モデル名:</label>
                <input type="text" id="modelNameInput" value="gemini-2.5-flash" placeholder="gemini-2.5-flash">
            </div>
            <button class="btn-main" onclick="saveApiSettings()">設定を保存</button>
        </div>
    </div>

    <script>
        // 質問カテゴリー定義（ご提示いただいたデータ）
        const questionCategories = {
            '基本属性': {
                'name': 'キャラクターの名前は何ですか？',
                'age': '年齢または年代は？',
                'gender': '性別または性自認は？',
                'occupation': '職業や立場は？',
                'birthplace': '出身地や住んでいる地域は？',
                'appearance': '身長や体格の特徴は？',
                'features': '外見的な特徴（髪型、目の色など）は？',
                'firstImpression': '第一印象でどのような人に見えますか？',
                'hobbies': '趣味は何ですか？（3-5個）',
                'strengths': '得意なことは何ですか？'
            },
            '性格・気質': {
                'temperament': '基本的な性格は明るい方ですか、それとも落ち着いている方ですか？',
                'sociability': '社交的ですか、それとも内向的ですか？',
                'perfectionism': '完璧主義者ですか、それとものんびり屋ですか？',
                'logic': '論理的ですか、それとも直感的ですか？',
                'decisiveness': '優柔不断ですか、それとも決断力がありますか？',
                'outlook': 'プラス思考ですか、それともマイナス思考ですか？',
                'impulsive': '衝動的ですか、それとも慎重ですか？',
                'humor': 'ユーモア好きですか？どのような冗談を好みますか？',
                'tidiness': '几帳面ですか、それとも大雑把ですか？',
                'emotions': '感情的になりやすいですか？',
                'dependency': '人に頼りやすいですか？',
                'leadership': 'リーダーシップはありますか？',
                'competitiveness': '競争心が強いですか？',
                'challenge': '新しいことに挑戦するのは好きですか？',
                'changePreference': '変化を好みますか、それとも安定を好みますか？',
                'discretion': '秘密を守ることができますか？',
                'honesty': '嘘をつきやすいですか？',
                'pride': 'プライドは高いですか？',
                'confidence': '自信がありますか？',
                'listening': '人の話を聞くのが得意ですか？'
            },
            '口調・言語表現': {
                'basicTone': '話すときの基本的な口調は敬語ですか、それともカジュアルですか？',
                'catchphrases': 'よく使う口癖はありますか？',
                'endingParticles': '語尾は固定していますか？',
                'politePeople': '丁寧に話しかけてくる人にはどう返しますか？',
                'closeFriends': '親友同然の人にはどのように話しかけますか？',
                'firstMeeting': '初対面の人にはどのような態度を取りますか？',
                'superiors': '目上の人に対してはどのような態度ですか？',
                'children': '子どもに対してはどのような態度ですか？',
                'laughs': 'よく笑いますか？',
                'anger': 'よく怒りますか？',
                'sighs': 'よくため息をつきますか？',
                'talkLength': '話が長いですか、それとも短くまとめますか？',
                'questions': '質問をよくしますか？',
                'selfDisclosure': '自分のことを話しやすいですか？',
                'jokes': '冗談を言いますか？',
                'praise': '褒めるのは得意ですか？',
                'criticism': '批判的に話しかけることはありますか？',
                'preaching': '説教的になることはありますか？',
                'empathy': '相手の話に共感を示しますか？',
                'silence': '沈黙を避けますか？'
            },
            '行動パターン': {
                'wakeTime': '朝は早く起きますか、それとも遅く起きますか？',
                'chronotype': '夜型ですか、朝型ですか？',
                'dailyRoutine': '1日の大半をどのように過ごしますか？',
                'weekend': '休日は何をして過ごしますか？',
                'socialFrequency': '友人とはどのくらいの頻度で会いますか？',
                'alone': '一人の時間をどのように使いますか？',
                'exercise': '運動はしますか？',
                'cooking': '料理は得意ですか？',
                'cleaning': '掃除は好きですか？',
                'shopping': '買い物は好きですか？',
                'travel': '旅行に行きますか？どのようなタイプの旅？',
                'movies': '映画や本は好きですか？ジャンルは？',
                'music': '音楽は好きですか？何を聴きますか？',
                'sns': 'SNSをよく使いますか？',
                'games': 'ゲームをしますか？',
                'eating': '食べることは好きですか？好物は？',
                'sweets': '甘いものは好きですか？',
                'alcohol': 'お酒は飲みますか？',
                'latenight': '夜更かしをしますか？',
                'earlysleep': '早寝するほうですか？'
            },
            '価値観・信念': {
                'important': '人生で最も大切なことは何ですか？',
                'friendship': '友情についてどう考えますか？',
                'romance': '恋愛についてどう考えますか？',
                'work': '仕事（学業）についてどう考えますか？',
                'money': 'お金についてどう考えますか？',
                'family': '家族についてどう考えますか？',
                'success': '成功の定義は何ですか？',
                'failure': '失敗についてどう考えますか？',
                'justice': '社会正義についてどう考えますか？',
                'rules': 'ルールについてどう考えますか？',
                'effort': '努力についてどう考えますか？',
                'happiness': '幸せの定義は何ですか？',
                'relationships': '人間関係で大切なことは何ですか？',
                'honesty2': '正直さについてどう考えますか？',
                'responsibility': '責任についてどう考えますか？'
            },
            '好みと嫌悪': {
                'dislikedFood': '嫌いな食べ物は何ですか？',
                'dislikedPeople': '嫌いな人のタイプは？',
                'dislikedSituation': '嫌いな状況は？',
                'fears': '怖いことは何ですか？',
                'stress': 'ストレスを感じるのはどんなときですか？',
                'season': '好きな季節は？',
                'weather': '好きな天気は？',
                'timeOfDay': '好きな時間帯は？',
                'place': '好きな場所は？',
                'smell': '好きな匂いは？',
                'color': '好きな色は？',
                'dislikedColor': '嫌いな色は？',
                'dislikedSound': '嫌いな音は？',
                'admiration': '敬意を感じる人のタイプは？',
                'lifelong': '一生かけてやりたいことは何ですか？'
            }
        };

        let chatHistory = [];
        let calendarEvents = [];
        let todoList = [];

        window.onload = function() {
            loadSavedData();
            buildQuestionsUI();
            renderCalendar();
            renderTodo();
        };

        // タブ切り替え
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 保存データの読み込み
        function loadSavedData() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('geminiApiKey') || '';
            document.getElementById('modelNameInput').value = localStorage.getItem('geminiModelName') || 'gemini-2.5-flash';
            document.getElementById('charNameInput').value = localStorage.getItem('geminiCharName') || 'エリザベス';
            document.getElementById('welcomeCharName').innerText = localStorage.getItem('geminiCharName') || 'エリザベス';

            calendarEvents = JSON.parse(localStorage.getItem('geminiCalendarEvents') || '[]');
            todoList = JSON.parse(localStorage.getItem('geminiTodoList') || '[]');
        }

        // API設定の保存
        function saveApiSettings() {
            localStorage.setItem('geminiApiKey', document.getElementById('apiKeyInput').value.trim());
            localStorage.setItem('geminiModelName', document.getElementById('modelNameInput').value.trim() || 'gemini-2.5-flash');
            alert('API設定を保存いたしました。');
        }

        function saveBasicCharInfo() {
            const name = document.getElementById('charNameInput').value.trim() || 'エリザベス';
            localStorage.setItem('geminiCharName', name);
            document.getElementById('welcomeCharName').innerText = name;
        }

        // 質問UIの自動構築
        function buildQuestionsUI() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            const savedAnswers = JSON.parse(localStorage.getItem('geminiCharAnswers') || '{}');

            for (const [catName, questions] of Object.entries(questionCategories)) {
                const box = document.createElement('div');
                box.className = 'cat-box';
                
                let html = `<h3>${catName}</h3><div class="q-grid">`;
                for (const [qKey, qLabel] of Object.entries(questions)) {
                    const val = savedAnswers[qKey] || '';
                    html += `
                        <div class="form-group">
                            <label>${qLabel}</label>
                            <input type="text" class="q-input" data-qkey="${qKey}" value="${escapeHtml(val)}" placeholder="未設定">
                        </div>
                    `;
                }
                html += `</div>`;
                box.innerHTML = html;
                container.appendChild(box);
            }
        }

        // 質問回答の保存
        function saveAllQuestions() {
            saveBasicCharInfo();
            const inputs = document.querySelectorAll('.q-input');
            const answers = {};
            inputs.forEach(input => {
                const key = input.getAttribute('data-qkey');
                const val = input.value.trim();
                if (val) answers[key] = val;
            });
            localStorage.setItem('geminiCharAnswers', JSON.stringify(answers));
            alert('✨ 質問設定を保存し、AIに反映いたしましたわ！');
        }

        // --- カレンダー機能 ---
        function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;

            if (!title || !date) return alert('タイトルと日付を入力してください。');

            calendarEvents.push({ id: Date.now(), title, date, time });
            calendarEvents.sort((a,b) => new Date(a.date + ' ' + (a.time||'00:00')) - new Date(b.date + ' ' + (b.time||'00:00')));
            
            localStorage.setItem('geminiCalendarEvents', JSON.stringify(calendarEvents));
            renderCalendar();

            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
        }

        function deleteEvent(id) {
            calendarEvents = calendarEvents.filter(e => e.id !== id);
            localStorage.setItem('geminiCalendarEvents', JSON.stringify(calendarEvents));
            renderCalendar();
        }

        function renderCalendar() {
            const list = document.getElementById('eventList');
            list.innerHTML = '';
            if (calendarEvents.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size:0.9rem;">予定はありません。</li>';
                return;
            }
            calendarEvents.forEach(e => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <strong>📅 ${escapeHtml(e.date)} ${e.time ? escapeHtml(e.time) : ''}</strong>
                        <div>${escapeHtml(e.title)}</div>
                    </div>
                    <button class="btn-danger" onclick="deleteEvent(${e.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        // --- ToDo機能 ---
        function addTodo() {
            const text = document.getElementById('todoInput').value.trim();
            if (!text) return;

            todoList.push({ id: Date.now(), text, completed: false });
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
            document.getElementById('todoInput').value = '';
        }

        function toggleTodo(id) {
            const item = todoList.find(t => t.id === id);
            if (item) item.completed = !item.completed;
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
        }

        function deleteTodo(id) {
            todoList = todoList.filter(t => t.id !== id);
            localStorage.setItem('geminiTodoList', JSON.stringify(todoList));
            renderTodo();
        }

        function renderTodo() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            if (todoList.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size:0.9rem;">タスクはありません。</li>';
                return;
            }
            todoList.forEach(t => {
                const li = document.createElement('li');
                li.className = `item-card ${t.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div style="cursor:pointer;" onclick="toggleTodo(${t.id})">
                        <input type="checkbox" ${t.completed ? 'checked' : ''}>
                        <span>${escapeHtml(t.text)}</span>
                    </div>
                    <button class="btn-danger" onclick="deleteTodo(${t.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        // --- AI通信 & チャット処理 ---
        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
            appendMessage('user', 'あなた', text);
            inputEl.value = '';

            const loadingId = appendLoadingMessage(charName);

            try {
                const reply = await callGeminiAPI(text);
                removeMessage(loadingId);
                appendMessage('model', charName, reply);

                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'model', content: reply });
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('model', 'システム', `⚠️ エラーが発生いたしました:\n${err.message}`);
            }
        }

        function appendMessage(sender, name, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'model-msg'}`;
            msgDiv.innerHTML = `<div class="msg-header">${escapeHtml(name)}</div><div>${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendLoadingMessage(name) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            const id = 'loading-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = 'message model-msg loading-dots';
            msgDiv.innerText = `${name}が考えています...`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // システムプロンプト生成（質問設定・カレンダー・ToDoを自動挿入）
        function buildSystemPrompt() {
            const charName = localStorage.getItem('geminiCharName') || 'エリザベス';
            const savedAnswers = JSON.parse(localStorage.getItem('geminiCharAnswers') || '{}');

            let rpSettings = '';
            for (const [catName, questions] of Object.entries(questionCategories)) {
                let catDetails = [];
                for (const [qKey, qLabel] of Object.entries(questions)) {
                    if (savedAnswers[qKey]) {
                        catDetails.push(`・${qLabel} → ${savedAnswers[qKey]}`);
                    }
                }
                if (catDetails.length > 0) {
                    rpSettings += `\n【${catName}】\n` + catDetails.join('\n');
                }
            }

            // カレンダーとToDoの現在状態を共有
            const upcomingEvents = calendarEvents.map(e => `${e.date} ${e.time||''}: ${e.title}`).join(' / ');
            const pendingTodos = todoList.filter(t => !t.completed).map(t => t.text).join(' / ');

            return `あなたは${charName}というキャラクターです。

以下はあなた（${charName}）の背景設定・属性・回答設定です。これらの性格・口調・価値観を徹底的に反映して対話し、なりきってください：
${rpSettings || '（特別なプロファイル未設定）'}

【現在の共有情報】
・登録されている予定: ${upcomingEvents || 'なし'}
・未完了のToDo: ${pendingTodos || 'なし'}

ユーザーからの問いかけに対し、必要に応じてカレンダーの予定やToDoにも触れつつ、上記キャラクターとして自然で魅力的な返答をしてください。`;
        }

        async function callGeminiAPI(userMessage) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) {
                return 'Gemini APIキーが設定されていません。「API設定」タブでキーを入力・保存してくださいませ。';
            }

            const modelName = localStorage.getItem('geminiModelName') || 'gemini-2.5-flash';
            const systemPrompt = buildSystemPrompt();

            const contents = [
                { role: 'user', parts: [{ text: `[システム指定・キャラクタープロファイル]\n${systemPrompt}` }] },
                { role: 'model', parts: [{ text: `了解いたしました。プロファイルに基づき完璧になりきってお話しいたします。` }] }
            ];

            chatHistory.slice(-6).forEach(msg => {
                contents.push({
                    role: msg.role === 'user' ? 'user' : 'model',
                    parts: [{ text: msg.content }]
                });
            });

            contents.push({ role: 'user', parts: [{ text: userMessage }] });

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                return `APIエラー (${response.status}): ${errData.error?.message || '通信に失敗いたしました'}`;
            }

            const data = await response.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                return data.candidates[0].content.parts[0].text;
            } else {
                return '⚠️ 応答メッセージを取得できませんでした。';
            }
        }
    </script>
